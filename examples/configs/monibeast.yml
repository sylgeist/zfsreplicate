# Example config migrated from a zxfer + zfs-auto-snapshot setup (host: monibeast).
#
# Decisions baked in:
#   - zfsreplicate owns snapshots (zfs-auto-snapshot + zfs-cleanup-snapshots retired)
#   - offline hosts fail fast (max_retries: 0) instead of retrying with backoff
#   - force: true to overwrite the pre-existing zxfer destinations on first run
#
# Recommended cron (daily, mirrors the old daily-30 retention):
#   0 1 * * *  root  timeout 8h /usr/local/bin/zfsreplicate sync >> /var/log/zfsreplicate.log 2>&1
#
# zxfer destination semantics: zxfer appends the source's last name component to
# the destination parent. zfsreplicate uses the exact destination dataset, so each
# target below already has that component appended (e.g. zxfer "zroot/ROOT
# tank/localbackups/zroot" -> tank/localbackups/zroot/ROOT).

concurrency: 3

replications:
  # ===== Local -> tank (monibeast, always online) =====
  - name: local-root
    source:      { dataset: zroot/ROOT }
    destination: { dataset: tank/localbackups/zroot/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30

  - name: local-home
    source:      { dataset: zroot/home }
    destination: { dataset: tank/localbackups/zroot/home }
    recursive: true
    force: true
    keep_snapshots: 30

  - name: local-bhyve
    source:      { dataset: zroot/bhyve }
    destination: { dataset: tank/localbackups/bhyve }
    recursive: true
    force: true
    keep_snapshots: 30

  - name: local-jails
    source:      { dataset: zroot/jails }
    destination: { dataset: tank/localbackups/jails }
    recursive: true
    force: true
    keep_snapshots: 30

  - name: local-sendrecv
    source:      { dataset: zroot/sendrecv.io }
    destination: { dataset: tank/localbackups/sendrecv.io }
    recursive: true
    force: true
    keep_snapshots: 30

  # ===== Remote OS backups, port 1978 (always run) =====
  - name: imap01-root
    source:      { host: imap01.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/imap01/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30

  - name: mail03-root
    source:      { host: mail03.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mail03/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30

  - name: mail04-root
    source:      { host: mail04.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mail04/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30

  # ===== Mini cluster (often offline -> fail fast) =====
  - name: mini1-root
    source:      { host: mini1.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mini1/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: mini1-bhyve
    source:      { host: mini1.risei.net, identity: /root/.ssh/replication, dataset: zroot/bhyve }
    destination: { dataset: tank/remotebackups/mini1/bhyve }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: mini2-root
    source:      { host: mini2.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mini2/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: mini2-bhyve
    source:      { host: mini2.risei.net, identity: /root/.ssh/replication, dataset: zroot/bhyve }
    destination: { dataset: tank/remotebackups/mini2/bhyve }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: mini3-root
    source:      { host: mini3.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mini3/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: mini3-bhyve
    source:      { host: mini3.risei.net, identity: /root/.ssh/replication, dataset: zroot/bhyve }
    destination: { dataset: tank/remotebackups/mini3/bhyve }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  # ===== Email (often offline -> fail fast) =====
  - name: imap-mail
    source:      { host: imap.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/imap }
    destination: { dataset: tank/remotebackups/imap }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  # NOTE: in the original script this sat under the imap.risei.net ping guard but
  # pulled from imap01.risei.net. Kept pulling from imap01 here.
  - name: imap01-jails
    source:      { host: imap01.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/jails }
    destination: { dataset: tank/remotebackups/imap01/jails }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  # ===== io.risei.net (offline-guarded) =====
  - name: io-root                      # pull
    source:      { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/io/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  # NOTE: original source was "tank/Backups/" (trailing slash); treated as tank/Backups.
  - name: io-backups                   # push
    source:      { dataset: tank/Backups }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/Backups }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: io-home                      # push
    source:      { dataset: zroot/home }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/home }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: io-git                       # push
    source:      { dataset: tank/Git }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/Git }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  # ===== rhea.risei.net (offline-guarded) =====
  - name: rhea-root                    # pull
    source:      { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/rhea/ROOT }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: rhea-projects                # push
    source:      { dataset: tank/Projects }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/monibeast/Projects }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: rhea-home                    # push
    source:      { dataset: zroot/home }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/monibeast/home }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: rhea-git                     # push
    source:      { dataset: tank/Git }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/monibeast/Git }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0

  - name: rhea-ca                      # push
    source:      { dataset: tank/CA }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/monibeast/CA }
    recursive: true
    force: true
    keep_snapshots: 30
    max_retries: 0
