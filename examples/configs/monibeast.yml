# Example config migrated from a zxfer + zfs-auto-snapshot setup (host: monibeast).
#
# Decisions baked in:
#   - zfsreplicate owns snapshots (zfs-auto-snapshot + zfs-cleanup-snapshots retired)
#   - offline hosts fail fast (max_retries: 0) instead of retrying with backoff
#   - no force: in config — the overwrite guard stays armed. For the first run
#     after migrating a host (pre-existing zxfer destinations), force that run
#     explicitly, e.g.:  zfsreplicate --host rhea.risei.net --force sync
#
# Recommended cron (daily, mirrors the old daily-30 retention):
#   0 1 * * *  root  timeout 8h /usr/local/bin/zfsreplicate sync >> /var/log/zfsreplicate.log 2>&1
#
# zxfer destination semantics: zxfer appends the source's last name component to
# the destination parent. zfsreplicate uses the exact destination dataset, so each
# target below already has that component appended (e.g. zxfer "zroot/ROOT
# tank/localbackups/zroot" -> tank/localbackups/zroot/ROOT).

concurrency: 3

replications:
  # ===== Local -> tank (monibeast, always online) =====
  - name: local-root
    source:      { dataset: zroot/ROOT }
    destination: { dataset: tank/localbackups/zroot/ROOT }
    recursive: true
    keep_snapshots: 30

  # zroot/home and tank/Git each fan out to several destinations, so those jobs
  # use distinct snapshot_prefix values: with a shared prefix the jobs would
  # prune each other's common bases once one destination fell behind.
  # NOTE: on a host already running these jobs with the default prefix, the
  # first run after this change is a full resend per destination (no common
  # snapshot under the new prefix), and old zfsreplicate-* snapshots must be
  # destroyed manually — see "Parallel execution" in the README.
  - name: local-home
    source:      { dataset: zroot/home }
    destination: { dataset: tank/localbackups/zroot/home }
    snapshot_prefix: zfsr-local
    recursive: true
    keep_snapshots: 30

  - name: local-bhyve
    source:      { dataset: zroot/bhyve }
    destination: { dataset: tank/localbackups/bhyve }
    recursive: true
    keep_snapshots: 30

  - name: local-jails
    source:      { dataset: zroot/jails }
    destination: { dataset: tank/localbackups/jails }
    recursive: true
    keep_snapshots: 30

  - name: local-sendrecv
    source:      { dataset: zroot/sendrecv.io }
    destination: { dataset: tank/localbackups/sendrecv.io }
    recursive: true
    keep_snapshots: 30

  # ===== Remote OS backups, port 1978 (always run) =====
  - name: imap01-root
    source:      { host: imap01.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/imap01/ROOT }
    recursive: true
    keep_snapshots: 30

  - name: mail03-root
    source:      { host: mail03.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mail03/ROOT }
    recursive: true
    keep_snapshots: 30

  - name: mail04-root
    source:      { host: mail04.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mail04/ROOT }
    recursive: true
    keep_snapshots: 30

  # ===== Mini cluster (offline, possibly permanently -> benched) =====
  # enabled: false keeps the jobs defined without cron failures; run one by
  # exact name (zfsreplicate sync mini1-root) to test when a node returns.
  # Existing destination data remains as the final archive meanwhile.
  - name: mini1-root
    source:      { host: mini1.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mini1/ROOT }
    recursive: true
    keep_snapshots: 30
    max_retries: 0
    enabled: false

  - name: mini1-bhyve
    source:      { host: mini1.risei.net, identity: /root/.ssh/replication, dataset: zroot/bhyve }
    destination: { dataset: tank/remotebackups/mini1/bhyve }
    recursive: true
    keep_snapshots: 30
    max_retries: 0
    enabled: false

  - name: mini2-root
    source:      { host: mini2.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mini2/ROOT }
    recursive: true
    keep_snapshots: 30
    max_retries: 0
    enabled: false

  - name: mini2-bhyve
    source:      { host: mini2.risei.net, identity: /root/.ssh/replication, dataset: zroot/bhyve }
    destination: { dataset: tank/remotebackups/mini2/bhyve }
    recursive: true
    keep_snapshots: 30
    max_retries: 0
    enabled: false

  - name: mini3-root
    source:      { host: mini3.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/mini3/ROOT }
    recursive: true
    keep_snapshots: 30
    max_retries: 0
    enabled: false

  - name: mini3-bhyve
    source:      { host: mini3.risei.net, identity: /root/.ssh/replication, dataset: zroot/bhyve }
    destination: { dataset: tank/remotebackups/mini3/bhyve }
    recursive: true
    keep_snapshots: 30
    max_retries: 0
    enabled: false

  # ===== Email (often offline -> fail fast) =====
  # Mailbox data is pulled from the physical host, not the imap.risei.net
  # floating IP: replication lineage and SSH host keys are per-machine, so a
  # failover flip would break both. If a second imap server appears, add its
  # own imap02-mail job (enabled: false while standby) rather than following
  # the floating IP.
  # zroot/imap/encrypted uses ZFS native encryption, and ZFS does not allow
  # non-raw replication streams (-R) of encrypted datasets — so this job is
  # raw: the destination stores ciphertext, and browsing/restoring requires
  # `zfs load-key` with the mail key. ESCROW THAT KEY off imap01 (vault), or
  # losing the host also loses the ability to read its backups.
  #
  # Mail runs on its own hourly cron line (the per-job lock makes overlap with
  # the nightly run harmless), so keep_snapshots is sized in hours — 168 = one
  # week:
  #   0 * * * *  root  /usr/local/bin/zfsreplicate sync imap01-mail
  #
  # host: must resolve to the droplet's own public address — not the floating
  # IP (breaks lineage/host keys on failover) and not a WireGuard/tunnel name
  # (single-stream tunnel throughput caps bulk sends at a fraction of the
  # real path bandwidth).
  - name: imap01-mail
    source:      { host: imap01.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/imap }
    destination: { dataset: tank/remotebackups/imap }
    raw_send: true
    recursive: true
    keep_snapshots: 168
    max_retries: 0

  # NOTE: in the original script this sat under the imap.risei.net ping guard but
  # pulled from imap01.risei.net. Kept pulling from imap01 here.
  - name: imap01-jails
    source:      { host: imap01.risei.net, port: 1978, identity: /root/.ssh/replication, dataset: zroot/jails }
    destination: { dataset: tank/remotebackups/imap01/jails }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  # ===== io.risei.net (offline-guarded) =====
  - name: io-root                      # pull
    source:      { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/io/ROOT }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  # tank/Backups' children replicate individually, flat under monibeast/ —
  # matching zxfer's old "tank/Backups/" trailing-slash spread and keeping io
  # structured like rhea. NOTE: a NEW child created under tank/Backups needs
  # its own job added here; nothing replicates the parent as a unit anymore.
  # (io-projects below is NOT a Backups child — its source is tank/Projects.)
  - name: io-infra1                    # push
    source:      { dataset: tank/Backups/infra1 }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/monibeast/infra1 }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: io-infra2                    # push
    source:      { dataset: tank/Backups/infra2 }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/monibeast/infra2 }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  # tank/Projects fans out to rhea AND io: rhea-projects keeps the default
  # prefix (already-established lineage), io gets its own.
  - name: io-projects                  # push
    source:      { dataset: tank/Projects }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/monibeast/projects }
    snapshot_prefix: zfsr-io
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: io-vault                     # push
    source:      { dataset: tank/Backups/vault }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/monibeast/vault }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: io-vpn                       # push
    source:      { dataset: tank/Backups/vpn }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/monibeast/vpn }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: io-www-ext                   # push
    source:      { dataset: tank/Backups/www-ext }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/monibeast/www-ext }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: io-home                      # push
    source:      { dataset: zroot/home }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/monibeast/home }
    snapshot_prefix: zfsr-io
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: io-git                       # push
    source:      { dataset: tank/Git }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/monibeast/Git }
    snapshot_prefix: zfsr-io
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  # ===== rhea.risei.net (offline-guarded) =====
  - name: rhea-root                    # pull
    source:      { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: zroot/ROOT }
    destination: { dataset: tank/remotebackups/rhea/ROOT }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: rhea-projects                # push
    source:      { dataset: tank/Projects }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/monibeast/Projects }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: rhea-home                    # push
    source:      { dataset: zroot/home }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/monibeast/home }
    snapshot_prefix: zfsr-rhea
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: rhea-git                     # push
    source:      { dataset: tank/Git }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/monibeast/Git }
    snapshot_prefix: zfsr-rhea
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  - name: rhea-ca                      # push
    source:      { dataset: tank/CA }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/monibeast/CA }
    recursive: true
    keep_snapshots: 30
    max_retries: 0

  # ===== Mail cascades: re-ship monibeast's raw imap replica offsite =====
  # A -> hub -> B,C: imap01 is touched once per hour by imap01-mail; these
  # jobs forward the hub's replica. create_snapshot: false because the source
  # is a recv target — the inbound recv -F would destroy locally-created
  # snapshots; the whole chain shares imap01-mail's zfsreplicate-* lineage.
  # Schedule after the inbound hourly, e.g.:
  #   30 * * * *  root  /usr/local/bin/zfsreplicate sync 'imap-cascade-*'
  - name: imap-cascade-rhea
    source:      { dataset: tank/remotebackups/imap }
    destination: { host: rhea.risei.net, identity: /root/.ssh/replication, dataset: tank/remotebackups/imap }
    create_snapshot: false
    raw_send: true
    recursive: true
    keep_snapshots: 168
    max_retries: 0

  - name: imap-cascade-io
    source:      { dataset: tank/remotebackups/imap }
    destination: { host: io.risei.net, identity: /root/.ssh/replication, dataset: zroot/remotebackups/imap }
    create_snapshot: false
    raw_send: true
    recursive: true
    keep_snapshots: 168
    max_retries: 0
